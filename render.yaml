services:
  # ── 1. React Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: agrowise-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # Set manually in Render dashboard after backend deploys
      - key: VITE_ML_BASE_URL
        sync: false          # Set manually in Render dashboard after ML service deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── 2. Node.js Backend ───────────────────────────────────────────────────────
  - type: web
    name: agrowise-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        sync: false          # Set to your agrowise-ml Render URL after it deploys
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY_1
        sync: false
      - key: OPENWEATHER_API_KEY_2
        sync: false

  # ── 3. Python ML Service (FastAPI + TensorFlow) ──────────────────────────────
  - type: web
    name: agrowise-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY_1
        sync: false
      - key: OPENWEATHER_API_KEY_2
        sync: false
